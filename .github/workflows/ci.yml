name: CI/CD

# Every push/PR runs the test suite and a production build. On pushes to main
# the Docker image is built and pushed to GHCR only after tests pass, then
# Render is triggered via deploy hook. PRs only run tests — no image is pushed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npx react-scripts test --watchAll=false

      - name: Production build
        run: npm run build

  # --- Set Concourse Pipeline Job ---
  # Keeps the Concourse pipeline definition (owned by Teric-Labs/concouse-ci)
  # in sync after every green push to main. Requires a PAT with repo access
  # to concouse-ci, stored as the CONCOURSE_TOKEN secret.
  set-pipeline:
    name: Set Concourse Pipeline
    needs: [test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Concourse pipeline definitions
        uses: actions/checkout@v4
        with:
          repository: Teric-Labs/concouse-ci
          ref: main
          path: concourse-ci
          token: ${{ secrets.CONCOURSE_TOKEN }}

      - name: Install fly-concourse
        run: |
          set -euo pipefail
          curl -fsSL -o fly-concourse \
            "http://13.63.167.40:8080/api/v1/cli?arch=amd64&platform=linux"
          chmod +x fly-concourse
          sudo mv fly-concourse /usr/local/bin/fly-concourse
          fly-concourse --version

      - name: Log in to Concourse
        run: |
          set -euo pipefail
          fly-concourse -t main login \
            -c http://13.63.167.40:8080 \
            -u admin \
            -p change_this_password

      - name: Set and unpause the pipeline
        env:
          CONCOURSE_USERNAME: ${{ secrets.CONCOURSE_USERNAME || 'EricPeter' }}
          CONCOURSE_TOKEN: ${{ secrets.CONCOURSE_TOKEN }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN || 'concouse-ci-webhook-token' }}
        run: |
          set -euo pipefail
          if [ -z "$CONCOURSE_TOKEN" ]; then
            echo "::error::CONCOURSE_TOKEN is not set; cannot check out concouse-ci or authenticate to GHCR."
            exit 1
          fi
          cat > concourse-ci/vars/secrets.yml <<EOF
          registry-username: ${CONCOURSE_USERNAME}
          registry-password: ${CONCOURSE_TOKEN}
          git-username: ${CONCOURSE_USERNAME}
          git-password: ${CONCOURSE_TOKEN}
          webhook-token: ${WEBHOOK_TOKEN}
          EOF
          fly-concourse -t main set-pipeline \
            -p wakilibot-web \
            -c concourse-ci/pipelines/wakilibot-web.yml \
            -l concourse-ci/vars/secrets.yml \
            --non-interactive
          fly-concourse -t main unpause-pipeline -p wakilibot-web

  build-and-push:
    name: Build and Push Docker Image
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # github.repository may contain uppercase letters (e.g. Teric-Labs/...)
      # but Docker registry names must be fully lowercase.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Verify image pushed
        run: |
          echo "Image pushed successfully to ${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to Render
    needs: [build-and-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered → https://wakilibot-web.onrender.com"
